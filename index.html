<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitReminder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">GitReminder</h1>
    <p class="app-subtitle">Quick reference for Git commands</p>
  </header>

  <main class="app-main">
    <section class="search-section">
      <input
        type="text"
        id="search-input"
        class="search-box"
        placeholder="Search Git commands..."
      >
    </section>

    <section class="commands-section">
      <div id="commands-container" class="commands-list">
        <!-- Commands will be injected here by JavaScript -->
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
